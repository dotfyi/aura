<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffdf9">
<title>ну ми 👀</title>
<style>
  :root {
    color-scheme: light;
    --bg: #fffdf9; --text: #37352f; --muted: #787774; --line: #ebe7de;
    --milk: #f7f4ee; --pink: #faf1f5; --yellow: #fbf3db; --blue: #e7f3f8; --green: #edf3ec; --orange: #fbecdd; --purple: #f1ecf8; --red: #fdebec;
    --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.6; padding-bottom: env(safe-area-inset-bottom, 0px); }
  main { max-width: 620px; margin: 0 auto; padding: 0 20px 48px; }

  h2 { font-size: 26px; line-height: 1.25; font-weight: 650; margin: 0 0 6px; }
  .lead { color: var(--muted); margin: 0 0 18px; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 36px 0; }

  /* hero */
  .hero { padding: calc(env(safe-area-inset-top, 0px) + 44px) 0 8px; }
  .since { margin: 0 0 8px; color: var(--muted); font-size: 16px; }
  h1 { font-size: clamp(36px, 11vw, 50px); line-height: 1.1; font-weight: 750; letter-spacing: -.02em; margin: 0 0 6px; }
  .hl { margin: 0 0 24px; font-size: 19px; color: var(--muted); }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0; padding: 0; list-style: none; }
  .tiles li { border-radius: 10px; padding: 14px 6px 12px; text-align: center; }
  .tiles b { display: block; font-size: 32px; line-height: 1.1; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tiles span { display: block; margin-top: 2px; font-size: 13px; color: var(--muted); }
  .note { margin: 12px 0 0; font-size: 14px; color: var(--muted); }

  /* year bar */
  .bar { position: relative; margin: 46px 0 0; }
  .strip { display: flex; height: 16px; border-radius: 8px; overflow: hidden; background: var(--milk); }
  .strip i { display: block; flex-basis: 0; box-shadow: inset -3px 0 0 var(--bg); }
  .mk { position: absolute; top: -34px; transform: translateX(-50%); font-size: 20px; line-height: 1; }
  .mk::after { content: ""; position: absolute; left: 50%; top: 24px; width: 1px; height: 14px; background: #c9c4b8; }
  .axis { display: flex; justify-content: space-between; margin-top: 6px; font-size: 13px; color: var(--muted); }
  .cap { margin: 4px 0 0; font-size: 13px; color: var(--muted); }

  /* callout */
  .callout { display: flex; gap: 12px; padding: 16px; border-radius: 6px; background: var(--milk); margin: 0; }
  .callout .ci { font-size: 24px; line-height: 1.3; }
  .callout.red { background: var(--red); }
  .callout > div { flex: 1; min-width: 0; }
  .callout p { margin: 0; }
  .callout .big { font-size: 20px; font-weight: 700; margin-bottom: 2px; }

  /* stats table */
  .stats { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .stats li { display: flex; align-items: center; gap: 12px; padding: 12px 2px; border-bottom: 1px solid var(--line); }
  .stats .e { font-size: 24px; width: 32px; text-align: center; }
  .stats b { font-size: 20px; font-weight: 650; white-space: nowrap; }
  .stats span.t { color: var(--muted); font-size: 15px; line-height: 1.35; }
  .stats .txt { display: flex; flex-direction: column; gap: 1px; }

  /* timeline toggles */
  details { margin: 0 0 6px; border-radius: 6px; }
  summary { list-style: none; cursor: pointer; padding: 8px 6px; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 18px; border-radius: 6px; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "▶"; font-size: 10px; color: var(--muted); transition: transform .15s; }
  details[open] > summary::before { transform: rotate(90deg); }
  summary:hover { background: var(--milk); }
  summary:focus-visible, button:focus-visible { outline: 3px solid #2383e2; outline-offset: 2px; }
  .chip { font-weight: 400; font-size: 13px; padding: 1px 8px; border-radius: 4px; color: var(--text); margin-left: auto; white-space: nowrap; }
  .body { padding: 2px 8px 14px 30px; border-left: 2px solid var(--line); margin-left: 12px; }
  .body p { margin: 0 0 8px; }
  .body .tot { color: var(--muted); font-size: 14px; }
  .body .wed { background: var(--red); border-radius: 6px; padding: 8px 12px; margin: 6px 0 8px; font-size: 15px; }

  /* final */
  .quote { border-left: 3px solid var(--text); padding: 2px 16px; margin: 0 0 14px; font-size: 18px; line-height: 1.5; }
  .sign { text-align: center; font-size: 22px; font-weight: 700; margin: 34px 0 22px; }
  .cta { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .hint { display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
  .hint small { font-size: 13px; color: var(--muted); }
  .pt { font-size: 30px; display: inline-block; animation: nudge 1.1s ease-in-out infinite; }
  @keyframes nudge { 0%, 100% { transform: translateX(-4px); } 50% { transform: translateX(8px); } }
  #love {
    font: inherit; font-size: 18px; font-weight: 600; color: var(--text); background: var(--red);
    border: 1px solid #f3c9cc; border-radius: 999px; padding: 13px 24px; cursor: pointer;
  }
  #love:active { transform: scale(.97); }

  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

  .rv { opacity: 0; transform: translateY(8px); transition: opacity .7s ease, transform .7s ease; }
  .rv.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .rv { opacity: 1; transform: none; transition: none; } .pt { animation: none; } }
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>

<main>
  <header class="hero">
    <p class="since">Усе почалось 7 квітня 2018</p>
    <h1 id="heroTitle">&nbsp;</h1>
    <p class="hl">разом, і це триває просто зараз</p>
    <ul class="tiles" id="counter"></ul>

    <div class="bar">
      <div class="strip" id="strip"></div>
      <div class="axis"><span>2018</span><span>зараз</span></div>
    </div>
  </header>

  <hr>

  <section>
    <h2 class="rv">Міні статистика 👀</h2>
    <p class="lead rv">Наш час у цифрах</p>
    <ul class="stats rv" id="stats"></ul>
  </section>

  <hr>

  <section>
    <h2 class="rv">Як усе змінювалось</h2>
    <p class="lead rv">Рік за роком. Усе навколо мінялось, а ми були поруч.</p>
    <div id="tl"></div>
  </section>

  <hr>

  

  <section>
    <p class="sign rv" id="sign"></p>
    <div class="cta rv">
      <div class="hint"><small>натисни</small><span class="pt" aria-hidden="true">👉</span></div>
      <button id="love" type="button">і я тебе кохаю</button>
    </div>
  </section>
</main>

<script>
// ====== МОЖНА ЗМІНИТИ ======
const START   = new Date(2018, 3, 7, 0, 0, 0);     // 7 квітня 2018 (місяць з 0: квітень = 3)
const WEDDING = new Date(2025, 11, 25, 0, 0, 0);   // 25 грудня 2025 (грудень = 11)
const SIGN = "кохаю тебе, твій чоловік";

// Що було в кожен рік. Заміни на свої справжні події
const NOTES = {
  1: "Ми вчились одне одного: звичок, жартів, навіть мовчання.",
  2: "З'явилось «наше»: місця, пісні й слова, зрозумілі лише нам.",
  3: "Дрібниці стали важливими, а головне стало спокійним.",
  4: "Вже важко було згадати, як було без одне одного.",
  5: "Ми стали ще ближчими: багато слів уже не потрібно.",
  6: "Ми змінились, а любов лишилась, тільки глибшою.",
  7: "Мовчати вдвох стало так само затишно, як і розмовляти.",
  8: "Ми розуміємо одне одного з півслова, а іноді й без слів.",
  9: "Цей рік ще триває, і ми пишемо його просто зараз."
};
// ===========================

const ORD = ["", "Перший рік", "Другий рік", "Третій рік", "Четвертий рік", "П'ятий рік", "Шостий рік",
  "Сьомий рік", "Восьмий рік", "Дев'ятий рік", "Десятий рік", "Одинадцятий рік", "Дванадцятий рік"];
const PAL = ["var(--blue)", "var(--green)", "var(--yellow)", "var(--pink)", "var(--orange)", "var(--purple)"];
const DAY = 864e5;

function pl(n, f) {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return f[2];
  if (b > 1 && b < 5) return f[1];
  if (b === 1) return f[0];
  return f[2];
}
const fmt = (n, d = 0) => n.toLocaleString('uk-UA', { maximumFractionDigits: d });

function diff(now, base) {
  let y = now.getFullYear() - base.getFullYear(), mo = now.getMonth() - base.getMonth(),
      d = now.getDate() - base.getDate(), h = now.getHours() - base.getHours(),
      mi = now.getMinutes() - base.getMinutes(), s = now.getSeconds() - base.getSeconds();
  if (s < 0) { s += 60; mi--; }
  if (mi < 0) { mi += 60; h--; }
  if (h < 0) { h += 24; d--; }
  if (d < 0) { d += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); mo--; }
  if (mo < 0) { mo += 12; y--; }
  return [y, mo, d, h, mi, s];
}

// головний лічильник
const units = [
  ["рік", "роки", "років"], ["місяць", "місяці", "місяців"], ["день", "дні", "днів"],
  ["година", "години", "годин"], ["хвилина", "хвилини", "хвилин"], ["секунда", "секунди", "секунд"]
];
const tiles = document.getElementById('counter');
units.forEach((u, i) => tiles.insertAdjacentHTML('beforeend', `<li style="background:${PAL[i]}"><b>0</b><span></span></li>`));
const heroTitle = document.getElementById('heroTitle');
function run() {
  const v = diff(new Date(), START);
  [...tiles.children].forEach((li, i) => {
    li.firstChild.textContent = v[i];
    li.lastChild.textContent = pl(v[i], units[i]);
  });
  heroTitle.textContent = `${v[0]} ${pl(v[0], units[0])}` + (v[1] ? ` і ${v[1]} ${pl(v[1], units[1])}` : '');
}
run(); setInterval(run, 1000);

// смужка років
const now = new Date(), ms = now - START;
let strip = '';
for (let k = 0; ; k++) {
  const from = new Date(START.getFullYear() + k, 3, 7), to = new Date(START.getFullYear() + k + 1, 3, 7);
  const end = to > now ? now : to;
  strip += `<i style="flex-grow:${(end - from) / (to - from)};background:${PAL[k % PAL.length]}" title="${from.getFullYear()}"></i>`;
  if (to > now) break;
}
const stripEl = document.getElementById('strip');
stripEl.innerHTML = strip;
if (WEDDING <= now) {
  const pct = (WEDDING - START) / ms * 100;
  stripEl.insertAdjacentHTML('afterend', `<div class="mk" style="left:${pct}%" aria-hidden="true">💍</div>`);
}

// масштаби
const days = Math.floor(ms / DAY), hours = Math.floor(ms / 36e5), mins = Math.floor(ms / 6e4);
const stats = [
  ["📆", fmt(days), pl(days, ["день", "дні", "днів"]) + " разом"],
  ["🫂", fmt(hours), pl(hours, ["година", "години", "годин"]) + ", прожитих поруч"],
  ["🍂", fmt(Math.floor(days / 91.31)), "пір року змінилось на наших очах"],
  ["🌕", fmt(Math.floor(ms / (29.530588 * DAY))), "разів Місяць ставав повним, поки ми були разом"],
  ["🫀", fmt(mins * 140 / 1e6) + " млн", "ударів двох сердець, що б'ються поруч"],
  ["🌞", fmt(ms / 1000 * 29.78 / 1e9, 1) + " млрд км", "ми пролетіли разом навколо Сонця"]
];
document.getElementById('stats').innerHTML = stats.map(s =>
  `<li><span class="e">${s[0]}</span><div class="txt"><b>${s[1]}</b><span class="t">${s[2]}</span></div></li>`).join('');

// таймлайн
const tl = document.getElementById('tl');
for (let k = 1; ; k++) {
  const from = new Date(START.getFullYear() + k - 1, 3, 7), to = new Date(START.getFullYear() + k, 3, 7);
  const ongoing = to > now;
  const total = Math.floor(((ongoing ? now : to) - START) / DAY);
  const wed = WEDDING >= from && WEDDING < to;
  const d = document.createElement('details');
  d.open = true; d.className = 'rv';
  d.innerHTML = `<summary>${ORD[k] || 'Рік ' + k}
      <span class="chip" style="background:${PAL[(k - 1) % PAL.length]}">${from.getFullYear()} — ${ongoing ? 'зараз' : to.getFullYear()}</span></summary>
    <div class="body">
      <p>${NOTES[k] || ''}</p>
      ${wed ? '<div class="wed">25 грудня 2025 — ми одружились 💍</div>' : ''}
      <div class="tot">Разом ${ongoing ? 'вже ' : ''}${fmt(total)} ${pl(total, ["день", "дні", "днів"])}</div>
    </div>`;
  tl.appendChild(d);
  if (ongoing) break;
}

document.getElementById('sign').textContent = SIGN;

// плавна поява
const els = document.querySelectorAll('.rv');
if ('IntersectionObserver' in window) {
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
  }), { threshold: 0.12 });
  els.forEach(el => io.observe(el));
} else els.forEach(el => el.classList.add('in'));

// ===== феєрверк із сердечок =====
const fx = document.getElementById('fx'), fc = fx.getContext('2d');
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const HEARTS = ['❤️','🧡','💛','💚','💙','💜','🩷','🩵','🤍','💖','💗','💓','💕','💞','💘','💝','🫶','🥰','😍','😘','✨','🌸','🌷'];
let W, H, parts = [], raf = null, lastT = 0;
function sizeFx() {
  const d = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight;
  fx.width = W * d; fx.height = H * d; fc.setTransform(d, 0, 0, d, 0, 0);
}
sizeFx(); addEventListener('resize', sizeFx);

function burst(x, y) {
  const n = reduce ? 10 : 28 + Math.floor(Math.random() * 12);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = (reduce ? 40 : 120) + Math.random() * (reduce ? 60 : 280);
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      e: HEARTS[Math.floor(Math.random() * HEARTS.length)], s: 20 + Math.random() * 18,
      life: 1, decay: 0.3 + Math.random() * 0.3 });
  }
  if (!raf) { lastT = performance.now(); raf = requestAnimationFrame(loop); }
}
function loop(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000); lastT = t;
  fc.clearRect(0, 0, W, H);
  fc.textAlign = 'center'; fc.textBaseline = 'middle';
  for (const p of parts) {
    p.vx *= Math.pow(0.35, dt); p.vy *= Math.pow(0.35, dt); p.vy += 260 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= p.decay * dt;
    if (p.life > 0) {
      fc.globalAlpha = Math.min(1, p.life * 1.6);
      fc.font = `${p.s}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
      fc.fillText(p.e, p.x, p.y);
    }
  }
  fc.globalAlpha = 1;
  parts = parts.filter(p => p.life > 0);
  raf = parts.length ? requestAnimationFrame(loop) : null;
  if (!raf) fc.clearRect(0, 0, W, H);
}
document.getElementById('love').addEventListener('click', e => {
  if (navigator.vibrate) navigator.vibrate(30);
  const r = e.currentTarget.getBoundingClientRect();
  burst(r.left + r.width / 2, r.top);
  const n = reduce ? 1 : 7;
  for (let i = 1; i <= n; i++)
    setTimeout(() => burst(W * (0.15 + Math.random() * 0.7), H * (0.15 + Math.random() * 0.45)), i * 320);
});
</script>
</body>
</html>
